[settings]
# Your WakaTime or Hackatime API key
api_key = aa05f0ea-8402-406a-aa10-3ec7bd3ed57b

# The API base URL for your target tracking server (e.g., Hackatime)
api_url = https://hackatime.hackclub.com/api/hackatime/v1

# Rate limit sending heartbeats to once every 120 seconds (the standard default)
heartbeat_rate_limit_seconds = 120

# Enables saving code stats locally when offline and syncing later
offline = true

# Connection timeout in seconds when communicating with the API
timeout = 120

# Automatically detect programming languages from file contents
guess_language = true

# Turns on debug messages in your log file if you need to troubleshoot
debug = false

# Optional file path exclusions using POSIX regex syntax
exclude =
    ^COMMIT_EDITMSG$
    ^TAG_EDITMSG$
    ^/var/(?!www/).*
    ^/etc/

[projectmap]
# Optional regex mapping to override or rename project names sent to the API
# projects/old-name = new-project-name

[project_api_key]
# Optional override to send specific project paths using a different API key
# ^/home/user/secret-project/ = alternate-api-key-here

[api_urls]
# Optional forwarding rules to send specific paths to multiple tracking servers
# ^/home/user/work/ = https://work.example.com/api/v1|your-work-api-key